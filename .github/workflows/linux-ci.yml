name: Linux source checks

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/linux-ci.yml"
      - "src/**"
      - "scripts/*_linux.py"
      - "packaging/linux/**"
      - "test/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Ubuntu source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_FROZEN: "1"
      MANGACRISP_LANGUAGE: "en"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 7zip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.15

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Run source and unit checks
        run: |
          uv run ruff check src/mangacrisp_app/platform/linux.py scripts/*_linux.py test/test_platform_linux.py test/test_linux_*.py
          uv run python -m compileall -q src scripts test
          uv run pytest -q
          uv run python -m mangacrisp_app.main --smoke-test
