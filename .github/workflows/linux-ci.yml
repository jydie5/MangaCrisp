name: Linux source checks

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/linux-ci.yml"
      - "src/**"
      - "scripts/*_linux.py"
      - "scripts/build_linux_app.py"
      - "packaging/linux/**"
      - "INSTALL.linux*.md"
      - "THIRD_PARTY_NOTICES.md"
      - "test/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Ubuntu source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_FROZEN: "1"
      MANGACRISP_LANGUAGE: "en"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 7zip \
            xvfb libxtst6 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.15

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Run source and unit checks
        run: |
          uv run ruff check src/mangacrisp_app/platform/*linux.py scripts/*_linux.py scripts/build_linux_app.py test/*linux*.py
          uv run python -m compileall -q src scripts test
          uv run pytest -q
          uv run python -m mangacrisp_app.main --smoke-test

  package:
    name: Build Ubuntu package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_FROZEN: "1"
      MANGACRISP_LANGUAGE: "en"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.15

      - name: Install project dependencies
        run: uv sync --extra dev --extra app

      - name: Build and smoke-test the one-folder application
        run: uv run python scripts/build_linux_app.py

      - name: Record checksum
        run: |
          cd dist
          sha256sum MangaCrisp-*-linux-x86_64.tar.gz | tee SHA256SUMS.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: mangacrisp-linux-x86_64
          path: |
            dist/MangaCrisp-*-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 14
