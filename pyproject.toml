[project]
name = "mangacrisp"
version = "0.5.0b0"
description = "AI-enhanced manga and comic viewer for Apple Silicon Macs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pillow>=10",
    "py7zr>=0.22",
    "rarfile>=4.2",
]

[project.scripts]
mangacrisp = "mangacrisp_app.main:main"

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
opencv = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]
dev = [
    "PySide6>=6.7",
    "cmake==4.4.0",
    "ninja==1.13.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pefile>=2023.2.7",
    "pytest>=8",
]
app = [
    "PyInstaller>=6.10",
    "PySide6>=6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/mangacrisp_app"]
